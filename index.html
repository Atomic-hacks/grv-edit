<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google needs a square icon in a multiple of 48px, and also probes
         /favicon.ico directly — both must be real image files. -->
    <link rel="icon" href="/img/logowhite.png" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRV HQ</title>
    <meta
      name="description"
      content="GRV HQ We've got style ! — Handpicked from your favorite brands and boutiques."
    />
    <!-- Site-wide only: this is a client-rendered SPA with no per-page
         server rendering, so every route currently shares this same
         title/description/image rather than each product or category
         page having its own. Most social-preview crawlers and some
         search engines don't execute JavaScript, so a client-side
         per-page update wouldn't reach them anyway — doing this properly
         needs prerendering or SSR, not a bigger index.html. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GRV HQ" />
    <meta property="og:title" content="GRV HQ — We've got style !" />
    <meta
      property="og:description"
      content="Handpicked from your favorite brands and boutiques."
    />
    <meta property="og:image" content="https://www.grvhq.com/img/logoblack.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="GRV HQ — We've got style !" />
    <meta
      name="twitter:description"
      content="Handpicked from your favorite brands and boutiques."
    />
    <meta name="twitter:image" content="https://www.grvhq.com/img/logoblack.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
